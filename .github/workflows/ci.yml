name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénérer dist/ depuis les tokens
        run: node build/build-tokens.mjs

      - name: dist/ doit être à jour dans le commit
        run: |
          if ! git diff --exit-code dist; then
            echo "::error::dist/ n'est pas synchronisé avec tokens/forma.tokens.json — lancez 'npm run build' et commitez."
            exit 1
          fi

      - name: Contrastes WCAG AA
        run: node build/check-contrast.mjs

      - name: Inventaire aligné sur le paquet
        run: node build/check-catalog.mjs

      - name: forma.js et thème ECharts se chargent
        run: npm run test:js

      - name: Régénérer la documentation de contraste
        run: node build/update-contrast-report.mjs

      - name: docs/foundations.md doit être à jour dans le commit
        run: |
          if ! git diff --exit-code docs/foundations.md; then
            echo "::error::docs/foundations.md n'est pas synchronisé avec les ratios de contraste actuels — lancez 'node build/update-contrast-report.mjs' et commitez."
            exit 1
          fi

      - name: Installation du paquet (npm pack)
        run: |
          npm pack
          TARBALL=$(ls -t *.tgz | head -1)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Vérification des points d'entrée
        run: |
          mkdir -p /tmp/forma-test
          cd /tmp/forma-test
          tar -xzf "$GITHUB_WORKSPACE/${{ env.TARBALL }}"

          # Vérifie que les CSS contiennent les tokens attendus
          if ! grep -q "forma-color-action" package/dist/forma.css; then
            echo "::error::forma.css ne contient pas --forma-color-action"
            exit 1
          fi
          if ! grep -q "forma-color-action" package/dist/forma-tokens.css; then
            echo "::error::forma-tokens.css ne contient pas --forma-color-action"
            exit 1
          fi

          # Vérifie que le module exporte version (export ESM nommé, jamais une clé JSON entre guillemets)
          if ! grep -q 'export const version' package/dist/forma.tokens.js; then
            echo "::error::forma.tokens.js n'exporte pas version"
            exit 1
          fi

          if ! grep -q '"fx-root"' package/catalog/forma.catalog.json; then
            echo "::error::l'inventaire catalog/forma.catalog.json est absent du paquet"
            exit 1
          fi

          if ! grep -q "data-fx-theme-toggle" package/dist/forma.js; then
            echo "::error::dist/forma.js est absent du paquet"
            exit 1
          fi
          if ! grep -q "export function formaTheme" package/dist/forma.echarts.js; then
            echo "::error::dist/forma.echarts.js est absent du paquet"
            exit 1
          fi
          if grep -q "data-forma-skin" package/dist/forma.css; then
            echo "::error::forma.css contient encore une règle de peau (data-forma-skin) : depuis 1.0.0, Forma n'a qu'un système"
            exit 1
          fi

          echo "✓ Points d'entrée vérifiés"
